packaging_format = 2

id = "grocy"
name = "Grocy"
description.en = "Web-based groceries & household management solution for your home"
description.fr = "Solution Web de gestion d'épicerie et de gestion de la maison"

version = "4.6.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://grocy.info/"
demo = "https://en.demo.grocy.info/stockoverview"
code = "https://github.com/grocy/grocy"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "1000M"
ram.build = "130M"
ram.runtime = "70M"

[install]

    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    
    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["de", "en", "es", "fr", "it", "pt"]
    default = "fr"

[resources]
        [resources.sources.main]
        url = "https://github.com/grocy/grocy/releases/download/v4.6.0/grocy_4.6.0.zip"
        sha256 = "8b39306d8110dc842f756262d2aa26a8539d830594da5e16e6436b425cff2355"
        in_subdir = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "grocy_.*.zip"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    [resources.apt]
    packages = "php8.5-ldap, php8.5-mbstring, php8.5-fileinfo, php8.5-sqlite3, php8.5-gd, php8.5-intl"
